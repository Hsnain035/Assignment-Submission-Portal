name: CI

on:
  push:
    branches: ["**"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # If any test fails, this step fails and so does the job.
      - name: Run tests
        run: pytest test_app.py --junitxml=report.xml

      # Runs whether the tests passed, failed, or never got that far.
      # Builds the JSON report from report.xml, saves it as report.json,
      # and POSTs it to the local receiver.
      - name: Send test report to receiver
        if: always()
        env:
          REPORT_RECEIVER_URL: ${{ secrets.REPORT_RECEIVER_URL }}
          REPORT_TOKEN: ${{ secrets.REPORT_TOKEN }}
        run: python3 run_tests_and_report.py --skip-run --junit-file report.xml --output report.json

      # Bonus: email the report after passing AND failing runs.
      # Skips quietly if the SMTP secrets are not configured.
      - name: Email test report
        if: always()
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python3 send_email_report.py --report report.json

      - name: Upload report as build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: |
            report.json
            report.xml
          if-no-files-found: ignore

  # Bonus: publish the static demo to GitHub Pages.
  # `needs: test` means this job only runs if every step of the test job
  # succeeded. If any test fails, deployment is skipped and the previously
  # published site stays exactly as it was.
  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    concurrency:
      group: pages
      cancel-in-progress: false

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static demo
        uses: actions/upload-pages-artifact@v3
        with:
          path: demo

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
